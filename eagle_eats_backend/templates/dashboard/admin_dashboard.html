<html>
    <body>
        <h1>Admin Dashboard</h1>
        <p>{{g.user["username"]}}</p>
        <form action="{{url_for('auth.logout')}}" method="post">
            <button type="submit">Logout</button>
        </form>
        <section>
            <h2>Kitchens</h2>
            {%for kitchen in kitchens%}
                <div style="background-color: red">
                    {{lucide("chef-hat")}}
                    <p>{{kitchen['username']}}</p>
                </div>
            {%endfor%}
        </section>
    </body>
</html>
